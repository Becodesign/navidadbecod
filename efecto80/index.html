<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertir tu foto con efecto de los 80S, Gratis</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Righteous&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a0826;
            color: #fff;
            font-family: 'Righteous', cursive;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #240a34;
            border: 3px solid #ff007f;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            color: #00f0ff;
            text-transform: uppercase;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        /* ESTILO PARA RESALTAR EL TEXTO */
        .highlight {
            color: #ffe600;
            font-size: 1.8rem;
        }

        .upload-area {
            border: 2px dashed #00f0ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            background: rgba(0, 240, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .upload-area:hover {
            background: rgba(0, 240, 255, 0.15);
        }

        .upload-area p {
            color: #00f0ff;
            font-size: 1.1rem;
        }

        input[type="file"] {
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 2px solid #ff007f;
            display: none;
            margin-top: 10px;
        }

        .btn-convert {
            background: #ff007f;
            border: none;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.85rem;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-convert:hover {
            background: #e00070;
        }

        .loader-container {
            display: none;
            margin-top: 25px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 0, 127, 0.2);
            border-top: 5px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #ffe600;
            font-size: 1rem;
        }

        .result-container {
            display: none;
        }

        .result-image {
            width: 100%;
            border-radius: 12px;
            border: 4px solid #00f0ff;
        }

        .result-text {
            font-size: 1.2rem;
            color: #ffe600;
            margin-bottom: 15px;
        }

        .btn-reset {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Righteous', cursive;
            transition: all 0.3s ease;
            margin-top: 15px;

        }

        .btn-reset:hover {
            background: #00f0ff;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 id="mainTitle">Convertir tu foto con <br /> <span class="highlight">efecto de los 80S</span><br />Gratis
        </h1>

        <div id="uploadSection">
            <div class="upload-area" onclick="document.getElementById('photoInput').click()">
                <p id="uploadText">📷 Haz clic para subir tu foto</p>
                <img id="userPreview" class="preview-image" alt="Vista previa de la foto">
            </div>
            <input type="file" id="photoInput" accept="image/*" onchange="previewUserPhoto(event)">

            <button class="btn-convert" id="convertBtn" onclick="processPhoto()">Convertir a los 80s</button>
        </div>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p class="loading-text">Aplicando filtros de estilo 80s...</p>
        </div>

        <div class="result-container" id="result">
            <p class="result-text">😎 ¡¡TE VES RADIANTE EN LOS 80s!! 😎</p>
            <img src="./resultado.jpg" alt="Resultado 80s" class="result-image">
            <button class="btn-reset" onclick="resetApp()">Intentar con otra foto</button>
        </div>
    </div>

    <script>
        function previewUserPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const imgElement = document.getElementById('userPreview');
                    const uploadText = document.getElementById('uploadText');

                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                    uploadText.innerText = '📷 Haz clic para cambiar de foto';
                }
                reader.readAsDataURL(file);
            }
        }

        function processPhoto() {
            const input = document.getElementById('photoInput');

            if (input.files.length === 0) {
                alert("Por favor, selecciona una foto primero.");
                return;
            }

            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                document.getElementById('mainTitle').style.display = 'none';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('result').style.display = 'block';
            }, 2500);
        }

        function resetApp() {
            document.getElementById('photoInput').value = "";
            document.getElementById('userPreview').src = "";
            document.getElementById('userPreview').style.display = "none";
            document.getElementById('uploadText').innerText = "📷 Haz clic para subir tu foto";

            document.getElementById('mainTitle').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
        }
    </script>

</body>

</html>
